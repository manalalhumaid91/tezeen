<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تزين الخدمة - لوحة التحكم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .card h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 700;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 10px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            box-sizing: border-box;
            color: var(--text-main);
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            background: #fff;
        }

        .action-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
            margin-top: 10px;
        }

        .action-btn:hover {
            background: #1e40af;
        }

        .logout-btn {
            background: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .qr-result-box {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .qr-result-box img {
            max-width: 200px;
            border: 4px solid var(--primary-light);
            border-radius: 12px;
            padding: 10px;
            background: white;
        }

        .footer-tazeen {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
        }

        .footer-tazeen span {
            color: var(--primary-color);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- بطاقة إعدادات المركز والشعار -->
        <div class="card">
            <h2>إعدادات المركز والشعار</h2>
            <div class="form-group">
                <label>اسم المركز / الشركة</label>
                <input type="text" id="company-name-input" placeholder="مثال: مركز تزين للخدمات">
            </div>
            <div class="form-group">
                <label>رابط شعار المركز (Logo URL أو صورة)</label>
                <input type="text" id="company-logo-input" placeholder="ألصق رابط الصورة هنا">
            </div>
            <button class="action-btn" onclick="saveCompanySettings()">حفظ إعدادات المركز</button>
        </div>

        <!-- بطاقة توليد باركود الموظف -->
        <div class="card">
            <h2>توليد باركود التقييم للموظف</h2>
            <div class="form-group">
                <label>اسم الموظف</label>
                <input type="text" id="emp-name-input" placeholder="مثال: سارة أحمد">
            </div>
            <div class="form-group">
                <label>اسم الفرع</label>
                <input type="text" id="store-name-input" placeholder="مثال: فرع الرياض">
            </div>
            <div class="form-group">
                <label>رابط صورة الموظف (Supabase Storage URL)</label>
                <input type="text" id="emp-photo-input" placeholder="رابط صورة الموظف من التخزين">
            </div>
            <button class="action-btn" onclick="generateQRCode()">إنشاء وعرض الباركود</button>

            <div class="qr-result-box" id="qr-result-container">
                <p style="font-size: 13px; font-weight: 600; color: var(--text-muted);">الباركود جاهز للطباعة أو الاستخدام:</p>
                <div id="qrcode-output"></div>
                <p id="generated-link-text" style="font-size: 11px; word-break: break-all; color: var(--primary-color); margin-top: 10px;"></p>
            </div>
        </div>

        <!-- بطاقة تسجيل الخروج -->
        <div class="card" style="text-align: center;">
            <button class="action-btn logout-btn" onclick="logoutSession()">تسجيل الخروج</button>
        </div>

    </div>

    <footer class="footer-tazeen">
        منصة <span>تزين</span> للخدمات والتقييمات الذكية &copy; 2026
    </footer>

    <!-- مكتبة لتوليد الباركود تلقائياً -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        // استرجاع البيانات المحفوظة مسبقاً إن وجدت
        document.getElementById('company-name-input').value = localStorage.getItem('tazeen_company') || 'مركز تزين';
        document.getElementById('company-logo-input').value = localStorage.getItem('tazeen_logo') || '';

        function saveCompanySettings() {
            const company = document.getElementById('company-name-input').value;
            const logo = document.getElementById('company-logo-input').value;
            
            localStorage.setItem('tazeen_company', company);
            localStorage.setItem('tazeen_logo', logo);
            alert('تم حفظ إعدادات المركز بنجاح!');
        }

        function generateQRCode() {
            const empName = document.getElementById('emp-name-input').value.trim();
            const storeName = document.getElementById('store-name-input').value.trim();
            const empPhoto = document.getElementById('emp-photo-input').value.trim();
            const companyName = document.getElementById('company-name-input').value.trim() || 'مركز تزين';

            if (!empName || !storeName) {
                alert('الرجاء إدخال اسم الموظف واسم الفرع على الأقل.');
                return;
            }

            // حفظ صورة الموظف محلياً لتظهر فوراً في صفحة index.html
            if (empPhoto) {
                localStorage.setItem(`emp_photo_${empName}_${storeName}`, empPhoto);
                localStorage.setItem(`emp_photo_${empName}`, empPhoto);
            }

            // بناء الرابط الموجه إلى صفحة العرض index.html
            const baseUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'index.html');
            const targetUrl = `${baseUrl}?emp=${encodeURIComponent(empName)}&store=${encodeURIComponent(storeName)}&company=${encodeURIComponent(companyName)}&photo=${encodeURIComponent(empPhoto)}`;

            // إظهار صندوق الباركود وتوليده
            const qrContainer = document.getElementById('qr-result-container');
            const qrOutput = document.getElementById('qrcode-output');
            const linkText = document.getElementById('generated-link-text');

            qrOutput.innerHTML = '';
            qrContainer.style.display = 'block';

            new QRCode(qrOutput, {
                text: targetUrl,
                width: 180,
                height: 180
            });

            linkText.innerText = targetUrl;
        }

        function logoutSession() {
            localStorage.clear();
            alert('تم تسجيل الخروج بنجاح.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
