<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تزين - لوحة التحكم والتقييمات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .brand-header {
            background: var(--bg-card);
            padding: 22px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.03);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand-header h1 {
            font-size: 20px;
            color: var(--primary-color);
            margin: 0;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 2px 10px rgba(30, 58, 138, 0.02);
        }

        .stat-card h3 {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 8px 0;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }

        .filter-section {
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-section select, .filter-section input {
            padding: 11px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
            background: #fafafa;
            color: var(--text-main);
        }

        .filter-section input {
            flex: 1;
        }

        .evaluations-section {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.03);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin: 0;
        }

        .refresh-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #1e40af;
        }

        .eval-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .eval-table th, .eval-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .eval-table th {
            color: var(--text-muted);
            font-weight: 600;
            background: var(--primary-light);
        }

        .eval-table tr:hover {
            background: #fafafa;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .badge-store {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ترويسة الشعار والفرع -->
        <div class="brand-header">
            <h1>لوحة تحكم تزين للتقييمات</h1>
            <div id="filter-info" style="font-size: 13px; color: var(--text-muted); font-weight: 600;">جاري التحميل...</div>
        </div>

        <!-- إحصائيات عامة -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي التقييمات</h3>
                <p class="number" id="total-count">0</p>
            </div>
            <div class="stat-card">
                <h3>متوسط التقييم العام</h3>
                <p class="number" id="avg-rating">0.0</p>
            </div>
        </div>

        <!-- شريط البحث والفلترة -->
        <div class="filter-section">
            <select id="rating-filter" onchange="filterData()">
                <option value="">جميع التقييمات</option>
                <option value="5">😁 ممتاز (5)</option>
                <option value="4">🙂 جيد (4)</option>
                <option value="3">😐 متوسط (3)</option>
                <option value="2">🙁 سيء (2)</option>
                <option value="1">😡 سيء جداً (1)</option>
            </select>
            <input type="text" id="search-input" placeholder="ابحث باسم العميل، رقم الجوال، أو التعليق..." oninput="filterData()">
        </div>

        <!-- جدول التقييمات -->
        <div class="evaluations-section">
            <div class="section-header">
                <h2>سجل التقييمات الواردة</h2>
                <button class="refresh-btn" onclick="fetchEvaluations()">تحديث</button>
            </div>
            <div style="overflow-x: auto;">
                <table class="eval-table">
                    <thead>
                        <tr>
                            <th>التقييم</th>
                            <th>اسم العميل</th>
                            <th>رقم الجوال</th>
                            <th>التعليق</th>
                            <th>الموظف والفرع</th>
                            <th>الوقت</th>
                        </tr>
                    </thead>
                    <tbody id="evaluations-list">
                        <tr>
                            <td colspan="6" class="no-data">جاري جلب البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tmiqnvzlnnvhjswkkdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJ8Usl1ZO5XVoIfbSRJD4Q_-tjZRNt2';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');

        let allEvaluations = [];

        async function fetchEvaluations() {
            try {
                let query = supabaseClient
                    .from('evaluations')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (storeId) {
                    query = query.eq('store_id', storeId);
                    document.getElementById('filter-info').innerText = `فرع: ${storeId}`;
                } else {
                    document.getElementById('filter-info').innerText = `جميع الفروع`;
                }

                const { data, error } = await query;
                if (error) throw error;

                allEvaluations = data || [];
                renderData(allEvaluations);

            } catch (err) {
                console.error(err);
                document.getElementById('evaluations-list').innerHTML = `<tr><td colspan="6" class="no-data" style="color: red;">خطأ في جلب البيانات: ${err.message}</td></tr>`;
            }
        }

        function renderData(evaluations) {
            const totalCount = evaluations.length;
            document.getElementById('total-count').innerText = totalCount;

            if (totalCount === 0) {
                document.getElementById('avg-rating').innerText = '0.0';
                document.getElementById('evaluations-list').innerHTML = `<tr><td colspan="6" class="no-data">لا توجد تقييمات مطابقة للبحث أو الفلتر</td></tr>`;
                return;
            }

            let sum = 0;
            let rowsHtml = '';

            evaluations.forEach(item => {
                const rating = item.rating || 0;
                sum += rating;

                let emoji = '😐 متوسط';
                if (rating == 5) emoji = '😁 ممتاز';
                else if (rating == 4) emoji = '🙂 جيد';
                else if (rating == 3) emoji = '😐 متوسط';
                else if (rating == 2) emoji = '🙁 سيء';
                else if (rating == 1) emoji = '😡 سيء جداً';

                const dateStr = item.created_at ? new Date(item.created_at).toLocaleString('ar-SA') : '-';
                const storeBadge = item.store_id ? `<span class="badge-store">فرع: ${item.store_id}</span>` : `<span class="badge-store" style="background:#f1f5f9; color:#64748b;">فرع عام</span>`;
                const empName = item.emp_id || 'سارة أحمد';

                rowsHtml += `
                    <tr>
                        <td><strong>${emoji}</strong></td>
                        <td>${item.customer_name || 'غير مسجل'}</td>
                        <td dir="ltr" style="text-align: right;">${item.customer_mobile || '-'}</td>
                        <td>${item.comment || '-'}</td>
                        <td>
                            <div>${empName}</div>
                            ${storeBadge}
                        </td>
                        <td>${dateStr}</td>
                    </tr>
                `;
            });

            const avg = (sum / totalCount).toFixed(1);
            document.getElementById('avg-rating').innerText = avg;
            document.getElementById('evaluations-list').innerHTML = rowsHtml;
        }

        function filterData() {
            const selectedRating = document.getElementById('rating-filter').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = allEvaluations.filter(item => {
                const matchesRating = selectedRating === "" || String(item.rating) === selectedRating;
                
                const name = (item.customer_name || '').toLowerCase();
                const mobile = (item.customer_mobile || '').toLowerCase();
                const comment = (item.comment || '').toLowerCase();
                const store = (item.store_id || '').toLowerCase();

                const matchesSearch = searchQuery === "" || 
                    name.includes(searchQuery) || 
                    mobile.includes(searchQuery) || 
                    comment.includes(searchQuery) ||
                    store.includes(searchQuery);

                return matchesRating && matchesSearch;
            });

            renderData(filtered);
        }

        fetchEvaluations();
    </script>
</body>
</html>
