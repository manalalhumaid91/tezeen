<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تزين - لوحة التحكم والتقييمات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.03);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 22px;
            color: var(--primary-color);
            margin: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            box-shadow: 0 2px 10px rgba(30, 58, 138, 0.02);
        }

        .stat-card h3 {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 8px 0;
        }

        .stat-card .number {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }

        .evaluations-section {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.03);
        }

        .evaluations-section h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .eval-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        .eval-table th, .eval-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .eval-table th {
            color: var(--text-muted);
            font-weight: 600;
            background: var(--primary-light);
        }

        .eval-table tr:hover {
            background: #fafafa;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>لوحة تحكم تزين للتقييمات</h1>
            <div id="filter-info" style="font-size: 13px; color: var(--text-muted);">جاري تحميل البيانات...</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي التقييمات</h3>
                <p class="number" id="total-count">0</p>
            </div>
            <div class="stat-card">
                <h3>متوسط التقييم العام</h3>
                <p class="number" id="avg-rating">0.0</p>
            </div>
        </div>

        <div class="evaluations-section">
            <h2>سجل التقييمات الأخيرة</h2>
            <div style="overflow-x: auto;">
                <table class="eval-table">
                    <thead>
                        <tr>
                            <th>التقييم</th>
                            <th>اسم العميل</th>
                            <th>رقم الجوال</th>
                            <th>التعليق</th>
                            <th>الموظف/الفرع</th>
                            <th>الوقت</th>
                        </tr>
                    </thead>
                    <tbody id="evaluations-list">
                        <tr>
                            <td colspan="6" class="no-data">جاري جلب التقييمات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tmiqnvzlnnvhjswkkdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJ8Usl1ZO5XVoIfbSRJD4Q_-tjZRNt2';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');

        async function fetchEvaluations() {
            try {
                let query = supabaseClient
                    .from('evaluations')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (storeId) {
                    query = query.eq('store_id', storeId);
                    document.getElementById('filter-info').innerText = `عرض تقييمات الفرع: ${storeId}`;
                } else {
                    document.getElementById('filter-info').innerText = `عرض جميع الفروع`;
                }

                const { data, error } = await query;

                if (error) throw error;

                renderData(data || []);

            } catch (err) {
                console.error(err);
                document.getElementById('evaluations-list').innerHTML = `<tr><td colspan="6" class="no-data" style="color: red;">خطأ في جلب البيانات: ${err.message}</td></tr>`;
            }
        }

        function renderData(evaluations) {
            const totalCount = evaluations.length;
            document.getElementById('total-count').innerText = totalCount;

            if (totalCount === 0) {
                document.getElementById('avg-rating').innerText = '0.0';
                document.getElementById('evaluations-list').innerHTML = `<tr><td colspan="6" class="no-data">لا توجد تقييمات مسجلة حتى الآن</td></tr>`;
                return;
            }

            let sum = 0;
            let rowsHtml = '';

            evaluations.forEach(item => {
                sum += (item.rating || 0);
                
                let emoji = '😐';
                if (item.rating == 5) emoji = '😁 ممتاز';
                else if (item.rating == 4) emoji = '🙂 جيد';
                else if (item.rating == 3) emoji = '😐 متوسط';
                else if (item.rating == 2) emoji = '🙁 سيء';
                else if (item.rating == 1) emoji = '😡 سيء جداً';

                const dateStr = item.created_at ? new Date(item.created_at).toLocaleString('ar-SA') : '-';

                rowsHtml += `
                    <tr>
                        <td>${emoji}</td>
                        <td>${item.customer_name || 'زائر كريم'}</td>
                        <td dir="ltr" style="text-align: right;">${item.customer_mobile || '-'}</td>
                        <td>${item.comment || '-'}</td>
                        <td>${item.emp_id || '-'} ${item.store_id ? '(' + item.store_id + ')' : ''}</td>
                        <td>${dateStr}</td>
                    </tr>
                `;
            });

            const avg = (sum / totalCount).toFixed(1);
            document.getElementById('avg-rating').innerText = avg;
            document.getElementById('evaluations-list').innerHTML = rowsHtml;
        }

        fetchEvaluations();
    </script>
</body>
</html>
