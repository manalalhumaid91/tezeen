<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المشتركين - منصة تزين</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo-badge {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .login-card h1 {
            font-size: 20px;
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .login-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 25px 0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            box-sizing: border-box;
        }

        .login-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .login-btn:hover {
            background: #1e40af;
        }

        .error-msg {
            color: #dc2626;
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-badge">تـ</div>
        <h1>بوابة دخول المشتركين</h1>
        <p>أدخل بريدك الإلكتروني وكلمة المرور الخاصة بشركتك</p>

        <div class="form-group">
            <label for="client-email">البريد الإلكتروني للشركة</label>
            <input type="email" id="client-email" placeholder="name@company.com">
        </div>

        <div class="form-group">
            <label for="client-password">كلمة المرور</label>
            <input type="password" id="client-password" placeholder="••••••••">
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">تسجيل الدخول</button>
        <p class="error-msg" id="errorMsg">البريد الإلكتروني أو كلمة المرور غير صحيحة!</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://tmiqnvzlnnvhjswkkdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJ8Usl1ZO5XVoIfbSRJD4Q_-tjZRNt2';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin() {
            const email = document.getElementById('client-email').value.trim();
            const password = document.getElementById('client-password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            if (!email || !password) {
                errorMsg.innerText = 'الرجاء إدخال البريد وكلمة المرور!';
                errorMsg.style.display = 'block';
                return;
            }

            loginBtn.innerText = 'جاري التحقق...';
            loginBtn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                // البحث عن الشركة في جدول clients بناءً على البريد وكلمة المرور
                const { data, error } = await supabaseClient
                    .from('clients')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    throw new Error('بيانات الدخول غير مطابقة');
                }

                // حفظ بيانات الشركة المشتركة في الذاكرة المحلية للجلسة مع البريد لضمان الفلترة الدقيقة
                localStorage.setItem('client_name', data.company_name);
                localStorage.setItem('client_logo', data.logo_url || '');
                localStorage.setItem('client_email', data.email);

                // الانتقال للوحة التحكم الخاصة بالعميل
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.error(err);
                errorMsg.innerText = 'البريد الإلكتروني أو كلمة المرور غير صحيحة!';
                errorMsg.style.display = 'block';
                loginBtn.innerText = 'تسجيل الدخول';
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
