<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل الحساب - منصة تزين</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.05);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo-badge {
            width: 65px; height: 65px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .login-card h1 { font-size: 20px; color: var(--primary-color); margin: 0 0 8px 0; font-weight: 700; }
        .login-card p.sub { font-size: 13px; color: var(--text-muted); margin: 0 0 25px 0; }

        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border-color); font-family: 'Cairo', sans-serif;
            font-size: 14px; outline: none; background: #fafafa; box-sizing: border-box;
        }
        .form-group input:focus { border-color: var(--primary-color); background: #fff; }
        .form-group input[readonly] { background: #f1f5f9; color: var(--text-muted); }

        .hint { font-size: 12px; color: var(--text-muted); margin: -12px 0 18px 0; text-align: right; }

        .login-btn {
            background: var(--primary-color); color: white; border: none;
            padding: 14px; border-radius: 12px; cursor: pointer;
            font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 600;
            width: 100%; transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }
        .login-btn:hover { background: #1e40af; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg { color: #dc2626; font-size: 13px; font-weight: 600; margin-bottom: 15px; display: none; }

        .success-icon {
            width: 80px; height: 80px; background: #ecfdf5;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px auto; border: 2px solid #10b981;
        }
        .success-icon svg { width: 40px; height: 40px; fill: #10b981; }

        .state { display: none; }
        .state.show { display: block; }
    </style>
</head>
<body>

<div class="login-card">

    <!-- جاري التحقق -->
    <div class="state show" id="state-loading">
        <div class="logo-badge">تـ</div>
        <h1>جاري التحقق من الدعوة...</h1>
        <p class="sub">لحظة من فضلك</p>
    </div>

    <!-- رابط غير صالح -->
    <div class="state" id="state-invalid">
        <div class="logo-badge">تـ</div>
        <h1>رابط الدعوة غير صالح</h1>
        <p class="sub" id="invalid-reason">تأكد من الرابط أو تواصل مع إدارة المنصة.</p>
    </div>

    <!-- نموذج التفعيل -->
    <div class="state" id="state-form">
        <div class="logo-badge">تـ</div>
        <h1>تفعيل حساب المنشأة</h1>
        <p class="sub" id="company-line">اختر كلمة مرور للدخول إلى لوحة التحكم</p>

        <p class="error-msg" id="errorMsg"></p>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" readonly dir="ltr" style="text-align:right;">
        </div>

        <div class="form-group">
            <label for="password">كلمة المرور الجديدة</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
        </div>
        <p class="hint">ثمانية أحرف على الأقل.</p>

        <div class="form-group">
            <label for="password2">تأكيد كلمة المرور</label>
            <input type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
        </div>

        <button class="login-btn" id="activateBtn" onclick="activate()">تفعيل الحساب</button>
    </div>

    <!-- تم التفعيل -->
    <div class="state" id="state-done">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h1>تم تفعيل الحساب</h1>
        <p class="sub" id="done-line">أهلاً بكم في منصة تزين</p>
        <button class="login-btn" onclick="window.location.href='dashboard.html'">الدخول إلى لوحة التحكم</button>
    </div>

</div>

<script>
    const SUPABASE_URL = 'https://tmiqnvzlnnvhjswkkdrk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_VJ8Usl1ZO5XVoIfbSRJD4Q_-tjZRNt2';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const token = new URLSearchParams(window.location.search).get('t');

    function show(id) {
        document.querySelectorAll('.state').forEach(s => s.classList.remove('show'));
        document.getElementById(id).classList.add('show');
    }

    function showError(text) {
        const box = document.getElementById('errorMsg');
        box.innerText = text;
        box.style.display = 'block';
    }

    function invalid(reason) {
        document.getElementById('invalid-reason').innerText = reason;
        show('state-invalid');
    }

    // ===== قراءة الدعوة =====
    // القراءة مسموحة للزائر لأن الرمز نفسه هو المفتاح،
    // ولا يمكن الوصول للسجل دون معرفة الرمز كاملاً.
    window.addEventListener('DOMContentLoaded', async () => {
        if (!token) { invalid('الرابط ناقص. استخدم الرابط كاملاً كما وصلك.'); return; }

        const { data, error } = await supabaseClient
            .rpc('invite_info', { p_token: token });

        if (error) {
            console.error(error);
            invalid('تعذّر التحقق من الدعوة. حاول لاحقاً أو تواصل مع إدارة المنصة.');
            return;
        }

        const info = typeof data === 'string' ? JSON.parse(data) : data;

        if (!info || !info.ok) {
            invalid(info && info.error ? info.error : 'رابط الدعوة غير صحيح.');
            return;
        }

        document.getElementById('email').value = info.email;
        document.getElementById('company-line').innerText =
            `${info.company} — اختر كلمة مرور للدخول إلى لوحة التحكم`;
        show('state-form');
    });

    // ===== التفعيل =====
    async function activate() {
        document.getElementById('errorMsg').style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const pass2 = document.getElementById('password2').value;
        const btn = document.getElementById('activateBtn');

        if (pass.length < 8) return showError('كلمة المرور يجب ألا تقل عن ثمانية أحرف.');
        if (pass !== pass2) return showError('كلمتا المرور غير متطابقتين.');

        btn.disabled = true;
        btn.innerText = 'جاري التفعيل...';

        try {
            // 1) إنشاء الحساب
            const { error: signUpError } = await supabaseClient.auth.signUp({
                email: email,
                password: pass
            });

            // لو الحساب موجود مسبقاً، نحاول الدخول به
            if (signUpError) {
                const { error: signInError } =
                    await supabaseClient.auth.signInWithPassword({ email, password: pass });
                if (signInError) throw new Error('تعذّر إنشاء الحساب. قد يكون البريد مسجّلاً بكلمة مرور مختلفة.');
            }

            // 2) التأكد من وجود جلسة
            const { data: sess } = await supabaseClient.auth.getSession();
            if (!sess.session) {
                throw new Error('تم إنشاء الحساب، لكن يلزم تأكيد البريد الإلكتروني أولاً. راجع بريدك ثم سجّل الدخول من صفحة الدخول.');
            }

            // 3) ربط الحساب بالشركة عبر الدعوة
            const { data, error } = await supabaseClient
                .rpc('redeem_client_invite', { p_token: token });
            if (error) throw error;

            const res = typeof data === 'string' ? JSON.parse(data) : data;
            if (!res.ok) throw new Error(res.error);

            document.getElementById('done-line').innerText =
                `أهلاً بكم في منصة تزين — ${res.company}`;
            show('state-done');

        } catch (err) {
            console.error(err);
            showError(err.message || 'تعذّر تفعيل الحساب.');
            btn.disabled = false;
            btn.innerText = 'تفعيل الحساب';
        }
    }
</script>
</body>
</html>
