<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم الخدمة - منصة تزين</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .rate-card {
            background: var(--bg-card);
            padding: 35px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .rate-card h1 {
            font-size: 18px;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .emp-info {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            box-sizing: border-box;
            color: var(--text-main);
        }

        .form-group textarea {
            resize: vertical;
            height: 90px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .submit-btn:hover {
            background: #1e40af;
        }

        .msg {
            font-size: 13px;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        .error-msg {
            color: #dc2626;
        }

        /* تنسيقات شاشة الشكر المطابقة للصورة تماماً */
        .success-screen {
            display: none;
            text-align: center;
        }

        .success-icon-badge {
            width: 75px;
            height: 75px;
            background: #f0fdf4;
            color: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: 0 auto 20px auto;
            border: 2px solid #bbf7d0;
        }

        .success-screen h2 {
            font-size: 24px;
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .success-screen p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 25px 0;
            font-weight: 600;
        }

        .submitted-badge-preview {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 16px;
            padding: 15px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .submitted-badge-preview span {
            font-size: 24px;
        }

        .submitted-badge-preview .badge-text {
            text-align: right;
        }

        .submitted-badge-preview .badge-text h4 {
            margin: 0;
            font-size: 14px;
            color: #d97706;
            font-weight: 700;
        }

        .reset-link {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .reset-link:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="rate-card" id="rateCardContainer">
        <!-- نموذج التقييم الأساسي -->
        <div id="formContent">
            <div class="logo-badge">تـ</div>
            <h1>تقييم مستوى الخدمة</h1>
            <div class="emp-info" id="empInfoText">جاري تحميل بيانات الموظف...</div>

            <div class="form-group">
                <label for="rating-select">كيف تقيم تجربتك معنا؟</label>
                <select id="rating-select">
                    <option value="ممتاز">😁 ممتاز</option>
                    <option value="جيد">🙂 جيد</option>
                    <option value="متوسط">😐 متوسط</option>
                    <option value="سيء">🙁 سيء</option>
                    <option value="سيء جداً">😡 سيء جداً</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cust-name">اسمك الكريم (اختياري)</label>
                <input type="text" id="cust-name" placeholder="مثال: محمد علي">
            </div>

            <div class="form-group">
                <label for="cust-mobile">رقم الجوال (اختياري)</label>
                <input type="tel" id="cust-mobile" placeholder="05xxxxxxxx" dir="ltr" style="text-align: right;">
            </div>

            <div class="form-group">
                <label for="cust-comment">ملاحظاتك أو اقتراحاتك</label>
                <textarea id="cust-comment" placeholder="شاركنا رأيك لتحسين خدماتنا..."></textarea>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="submitEvaluation()">إرسال التقييم</button>
            <p class="msg error-msg" id="errorMsg">حدث خطأ أثناء إرسال التقييم، يرجى المحاولة مجدداً.</p>
        </div>

        <!-- شاشة رسالة الشكر المطابقة تماماً للتصميم -->
        <div class="success-screen" id="successScreen">
            <div class="success-icon-badge">✓</div>
            <h2>شكراً لك</h2>
            <p>تقييمك وصل.. وبـ رأيك تزين خدمتنا</p>
            
            <div class="submitted-badge-preview">
                <span id="chosenRatingEmoji">🙁</span>
                <div class="badge-text">
                    <h4 id="chosenRatingText">سيء</h4>
                </div>
            </div>

            <a class="reset-link" onclick="window.location.reload()">Submit another response</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tmiqnvzlnnvhjswkkdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJ8Usl1ZO5XVoIfbSRJD4Q_-tjZRNt2';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const storeName = urlParams.get('store') || 'الفرع الرئيسي';
        const empName = urlParams.get('emp') || 'موظف خدمة العملاء';
        const clientEmail = urlParams.get('client') || '';

        document.getElementById('empInfoText').innerHTML = `الفرع: <strong>${storeName}</strong><br>الموظف: <strong>${empName}</strong>`;

        async function submitEvaluation() {
            const ratingSelect = document.getElementById('rating-select');
            const rating = ratingSelect.value;
            const customerName = document.getElementById('cust-name').value.trim();
            const customerMobile = document.getElementById('cust-mobile').value.trim();
            const comment = document.getElementById('cust-comment').value.trim();
            
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!clientEmail) {
                errorMsg.innerText = 'رابط التقييم غير صالح (معرف الشركة مفقود في الرابط)';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.innerText = 'جاري الإرسال...';
            submitBtn.disabled = true;

            try {
                const { data, error } = await supabaseClient
                    .from('evaluations')
                    .insert([
                        {
                            client_email: clientEmail,
                            store_id: storeName,
                            emp_id: empName,
                            rating: rating,
                            customer_name: customerName || 'زائر كريم',
                            customer_mobile: customerMobile || '',
                            comment: comment || ''
                        }
                    ]);

                if (error) {
                    console.error("Supabase Error Details:", error);
                    throw error;
                }

                // عرض بطاقة الشكر المطابقة للصورة وإخفاء نموذج الإدخال
                document.getElementById('chosenRatingEmoji').innerText = ratingSelect.options[ratingSelect.selectedIndex].text.split(' ')[0];
                document.getElementById('chosenRatingText').innerText = ratingSelect.options[ratingSelect.selectedIndex].text.split(' ')[1] || rating;
                
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('successScreen').style.display = 'block';

            } catch (err) {
                console.error("Catch Exception:", err);
                errorMsg.innerText = 'حدث خطأ أثناء إرسال التقييم: ' + (err.message || 'خطأ غير معروف');
                errorMsg.style.display = 'block';
                submitBtn.innerText = 'إرسال التقييم';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
