<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم الخدمة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        
        :root {
            --primary-color: #1e3a8a;
            --primary-light: #f0f6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .rating-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.05);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
        }

        .rating-card h2 {
            font-size: 20px;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .rating-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 20px 0;
        }

        .emp-badge-info {
            background: var(--primary-light);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            outline: none;
            background: #fafafa;
            box-sizing: border-box;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
        }

        .submit-btn:hover {
            background: #1e40af;
        }

        .success-msg {
            display: none;
            color: #059669;
            font-weight: 700;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="rating-card">
        <h2>قيم تجربتك معنا</h2>
        <p>رأيك يهمنا لتحسين جودة الخدمة</p>

        <div class="emp-badge-info" id="target-info">
            جاري تحميل بيانات الخدمة...
        </div>

        <form id="ratingForm" onsubmit="submitRating(event)">
            <div class="form-group">
                <label for="rating">التقييم العام</label>
                <select id="rating" required>
                    <option value="">اختر التقييم...</option>
                    <option value="ممتاز">😁 ممتاز</option>
                    <option value="جيد">🙂 جيد</option>
                    <option value="متوسط">😐 متوسط</option>
                    <option value="سيء">🙁 سيء</option>
                    <option value="سيء جداً">😡 سيء جداً</option>
                </select>
            </div>

            <div class="form-group">
                <label for="customer_name">اسمك (اختياري)</label>
                <input type="text" id="customer_name" placeholder="اكتب اسمك هنا">
            </div>

            <div class="form-group">
                <label for="customer_mobile">رقم الجوال (اختياري)</label>
                <input type="tel" id="customer_mobile" placeholder="05xxxxxxxx" dir="ltr" style="text-align: right;">
            </div>

            <div class="form-group">
                <label for="comment">ملاحظاتك أو اقتراحاتك</label>
                <textarea id="comment" rows="3" placeholder="اكتب تعليقك هنا..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال التقييم</button>
        </form>

        <div class="success-msg" id="successMsg">شكراً لك! تم إرسال تقييمك بنجاح.</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tmiqnvzlnnvhjswkkdrk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJ8Usl1ZO5XVoIfbSRJD4Q_-tjZRNt2';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // قراءة المتغيرات من رابط الـ QR (الفرع، الموظف، وبريد أو معرف الشركة)
        const urlParams = new URLSearchParams(window.location.search);
        const store = urlParams.get('store') || 'الفرع الرئيسي';
        const emp = urlParams.get('emp') || 'عام';
        const clientEmail = urlParams.get('client') || ''; // بريد الشركة المرفق في الرابط

        document.getElementById('target-info').innerHTML = `الفرع: <strong>${store}</strong> | الموظف: <strong>${emp}</strong>`;

        async function submitRating(event) {
            event.preventDefault();

            const rating = document.getElementById('rating').value;
            const customerName = document.getElementById('customer_name').value.trim();
            const customerMobile = document.getElementById('customer_mobile').value.trim();
            const comment = document.getElementById('comment').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.innerText = 'جاري الإرسال...';
            submitBtn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('evaluations')
                    .insert([
                        {
                            rating: rating,
                            customer_name: customerName,
                            customer_mobile: customerMobile,
                            comment: comment,
                            store_id: store,
                            emp_id: emp,
                            client_email: clientEmail // ربط التقييم بحساب الشركة مباشرة
                        }
                    ]);

                if (error) throw error;

                document.getElementById('ratingForm').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء إرسال التقييم، يجدر المحاولة مجدداً.');
                submitBtn.innerText = 'إرسال التقييم';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
